name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: advanced-hello-world-fe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: advanced-hello-world-fe
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: YutakaX17/advanced-hello-world-fe-core
          ref: 3ce9f33a96d1ad6cfbdb3858cc4351f23868fe5b
          path: advanced-hello-world-fe-core
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: YutakaX17/advanced-hello-world-fe-messages
          ref: 6034e5b1521367ca9d63ad71fad58de2299f996f
          path: advanced-hello-world-fe-messages
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: advanced-hello-world-fe/package-lock.json
      - name: Build frontend core
        working-directory: advanced-hello-world-fe-core
        run: |
          npm ci
          npm run build
      - name: Build frontend messages
        working-directory: advanced-hello-world-fe-messages
        run: |
          npm ci
          npm run build
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run modules:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
